name: 🐞 بلاغ عن خطأ
description: أبلغ عن مشكلة في المتصفح
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: ما المشكلة؟, description: وصف واضح مع الخطوات }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: إصدار التطبيق, placeholder: "1.5" }
  - type: input
    id: device
    attributes: { label: الجهاز وإصدار أندرويد, placeholder: "Pixel 7 / Android 14" }
  - type: textarea
    id: site
    attributes: { label: الموقع المتأثر (إن وُجد) }
