name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  check:
    name: فحص المشروع
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Project check (Python)
        run: python3 tools/project_check.py

  build:
    name: بناء واختبار
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Decode signing key (إن وُجدت الأسرار)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nova-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/nova-release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::notice::لا توجد أسرار توقيع — سيُوقَّع الإصدار بمفتاح debug"
          fi

      - name: Lint + Unit tests
        run: gradle lintDebug testDebugUnitTest --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build debug + release APK
        run: gradle assembleDebug assembleRelease --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Nova Go — نتيجة البناء"
            echo "- التوقيع: ${SIGNED:-debug (لا أسرار)}"
            for f in app/build/outputs/apk/*/*.apk; do
              [ -f "$f" ] && echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1) — sha256 \`$(sha256sum "$f" | cut -c1-16)…\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: nova-go-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nova-release.jks"
