name: إنشاء مفتاح توقيع الإصدار (لمرة واحدة)

# ⚠️ شغّلها يدويًا مرة واحدة فقط من تبويب Actions، انسخ القيم،
# ثم احذف الـ Artifact فورًا من صفحة الـ run (المستودع عام — أي حد يقدر يشوفه ويحمّله قبل الحذف).
on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'اسم مستعار المفتاح (Key Alias)'
        required: true
        default: 'nova-release'
      validity_years:
        description: 'مدة صلاحية المفتاح بالسنوات (استخدم مدة طويلة — لا يمكن تغييره لاحقًا بسهولة)'
        required: true
        default: '27'
      dname:
        description: 'بيانات الشهادة (CN=الاسم, OU=القسم, O=المؤسسة, L=المدينة, S=المحافظة, C=رمز الدولة)'
        required: true
        default: 'CN=Nova Browser, OU=Dev, O=Nova, L=NA, S=NA, C=US'

permissions:
  contents: read

jobs:
  generate:
    name: توليد المفتاح
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }

      - name: توليد كلمة سر عشوائية
        id: pass
        run: |
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32)
          echo "::add-mask::$PASS"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: إنشاء الـ keystore
        env:
          PASS: ${{ steps.pass.outputs.pass }}
          ALIAS: ${{ inputs.alias }}
          DNAME: ${{ inputs.dname }}
          DAYS: ${{ inputs.validity_years }}
        run: |
          keytool -genkeypair -v \
            -keystore nova-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity $((DAYS * 365)) \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "$DNAME"

      - name: تجهيز الملفات للنسخ
        env:
          PASS: ${{ steps.pass.outputs.pass }}
          ALIAS: ${{ inputs.alias }}
        run: |
          base64 -w0 nova-release.jks > nova-release.jks.base64.txt
          {
            echo "انسخ القيم دي إلى: Settings → Secrets and variables → Actions → New repository secret"
            echo "كل سطر = اسم السر الأول، والقيمة بعد ="
            echo ""
            echo "KEY_ALIAS=$ALIAS"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo ""
            echo "KEYSTORE_BASE64 = محتوى ملف nova-release.jks.base64.txt كاملاً (سطر واحد طويل، انسخه كما هو بدون أي تعديل أو مسافات)"
          } > secrets-to-copy.txt

      - name: رفع الملفات كـ Artifact (احذفه فور النسخ!)
        uses: actions/upload-artifact@v4
        with:
          name: nova-release-keystore-DELETE-ME
          path: |
            nova-release.jks
            nova-release.jks.base64.txt
            secrets-to-copy.txt
          retention-days: 1

      - name: تنظيف مساحة العمل
        if: always()
        run: rm -f nova-release.jks nova-release.jks.base64.txt secrets-to-copy.txt

      - name: ملخص وتعليمات
        if: always()
        run: |
          {
            echo "## 🔑 تم إنشاء مفتاح التوقيع"
            echo ""
            echo "1. انزل لتحت لقسم **Artifacts** في هذا الـ run وحمّل \`nova-release-keystore-DELETE-ME\`."
            echo "2. افتح \`secrets-to-copy.txt\` داخله وانسخ القيم الأربع إلى:"
            echo "   **Settings → Secrets and variables → Actions → New repository secret**"
            echo "   (الأسماء: \`KEYSTORE_BASE64\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\`, \`KEY_PASSWORD\`)"
            echo "3. احفظ نسخة من ملف \`nova-release.jks\` وكلمة السر في مكان آمن خارج GitHub (مدير كلمات سر) — هو مفتاح تطبيقك الدائم ولو ضاع مش هتقدر تحدّث نفس التطبيق على المتجر تاني."
            echo "4. **احذف هذا الـ Artifact فورًا بعد كده** من هذه الصفحة (زر 🗑 بجانب اسمه) — المستودع عام فأي حد شايف الـ Actions يقدر يحمّله قبل الحذف."
            echo "5. (اختياري) بعد التأكد إن الأسرار اتضافت صح، احذف ملف هذا الـ workflow نفسه من المستودع عشان محدش يقدر يولّد مفتاح تاني بالغلط."
          } >> "$GITHUB_STEP_SUMMARY"
