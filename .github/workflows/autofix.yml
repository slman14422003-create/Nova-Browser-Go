name: Auto Fix

on:
  workflow_run:
    workflows: [Release, CI]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      WF_NAME: ${{ github.event.workflow_run.name }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Loop guard
        id: guard
        run: |
          n=$(git log -3 --format=%s | grep -c '^autofix:' || true)
          if [ "$n" -ge 3 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Download failed log
        if: steps.guard.outputs.skip == 'false'
        run: gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > failed.log || true

      - name: Apply fixes
        if: steps.guard.outputs.skip == 'false'
        id: fix
        run: |
          out=$(python3 tools/autofix.py failed.log)
          echo "fixed=$out" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.guard.outputs.skip == 'false' && steps.fix.outputs.fixed != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app tools
          git commit -m "autofix: ${{ steps.fix.outputs.fixed }}"
          git push origin HEAD:main

      - name: Re-run workflow
        if: steps.guard.outputs.skip == 'false' && steps.fix.outputs.fixed != ''
        run: |
          if [ "$WF_NAME" = "Release" ]; then
            tag="$HEAD_BRANCH"
            git tag -f "$tag"
            git push -f origin "$tag"
          else
            gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main || true
          fi
