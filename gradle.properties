org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true
# AGP 9 جعل قواعد keep صارمة افتراضياً؛ نُبقي السلوك السابق لتفادي أعطال reflection في النسخة المنشورة (NewPipe/Rhino)
android.r8.strictFullModeForKeepRules=false
# R8 Full Mode بيعمل inlining/تحسين قبل ما إعادة توجيه الـ core library desugaring (j$.*) تتطبق صح أحياناً،
# وده بيسبب NoSuchMethodError وقت التشغيل لدوال جافا حديثة (مثل URLDecoder.decode مع Charset) على أندرويد قديم.
# Compat Mode أكثر أمانًا مع هذا التفاعل.
android.enableR8.fullMode=false
